name: Release Packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # Default env; will be overridden by metadata step
      APP_NAME: Coco Downloader
      APP_SLUG: coco-downloader
      # Expose secrets to env so they can be used in step if: expressions
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
      APPLE_API_KEY_BASE68: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app metadata
        id: meta
        shell: bash
        run: |
          set -e
          APP_NAME="${APP_NAME:-}"
          APP_SLUG="${APP_SLUG:-}"
          VERSION=""
          [ -f APP_NAME ] && APP_NAME=$(cat APP_NAME)
          [ -f APP_SLUG ] && APP_SLUG=$(cat APP_SLUG)
          [ -f VERSION ] && VERSION=$(cat VERSION)
          if [ -z "$VERSION" ] && [ -n "${GITHUB_REF_NAME:-}" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          echo "APP_NAME=$APP_NAME" | tee -a "$GITHUB_ENV"
          echo "APP_SLUG=$APP_SLUG" | tee -a "$GITHUB_ENV"
          echo "APP_VERSION=${VERSION:-0.1.0}" | tee -a "$GITHUB_ENV"
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "app_slug=$APP_SLUG" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION:-0.1.0}" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Bundle aria2 binary (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install aria2 --no-progress -y
          $aria = (Get-Command aria2c).Source
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Copy-Item $aria bin\aria2c.exe -Force

      - name: Bundle aria2 binary (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew update
          brew install aria2 || true
          mkdir -p bin
          which aria2c && cp "$(which aria2c)" bin/aria2c || echo "aria2c not found"
          chmod +x bin/aria2c || true

      - name: Bundle aria2 binary (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 || true
          mkdir -p bin
          command -v aria2c && cp "$(command -v aria2c)" bin/aria2c || echo "aria2c not found"

      - name: Prepare macOS env (bundle id/version)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ -f BUNDLE_ID ]; then echo "BUNDLE_ID=$(cat BUNDLE_ID)" >> "$GITHUB_ENV"; fi
          if [ -f VERSION ]; then echo "APP_VERSION=$(cat VERSION)" >> "$GITHUB_ENV"; fi

      - name: Build with PyInstaller
        run: |
          pyinstaller -y downloader.spec

      # Windows: build installer with Inno Setup
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: powershell
        env:
          APP_NAME: ${{ steps.meta.outputs.app_name }}
          APP_SLUG: ${{ steps.meta.outputs.app_slug }}
        run: |
          choco install innosetup --no-progress -y
          # Prepare version and code signing env for Inno
          $version = "0.1.0"
          if (Test-Path VERSION) { $version = (Get-Content VERSION -Raw).Trim() }
          elseif ($env:GITHUB_REF_NAME) { $version = $env:GITHUB_REF_NAME.TrimStart('v') }
          $env:APP_VERSION = $version
          if ($env:WINDOWS_CERT_PFX_BASE64 -and $env:WINDOWS_CERT_PASSWORD) {
            $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
            $env:WINDOWS_CERT_PFX_PATH = $pfx
            if (-not $env:WINDOWS_TIMESTAMP_URL) { $env:WINDOWS_TIMESTAMP_URL = 'https://timestamp.digicert.com' }
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe" /Qp installer.iss

      # macOS: codesign .app (if signing secrets provided)
      - name: Import Apple signing certificates
        if: ${{ runner.os == 'macOS' && env.MACOS_CERT_P12_BASE64 != '' }}
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ env.MACOS_CERT_P12_BASE64 }}
          p12-password: ${{ env.MACOS_CERT_PASSWORD }}

      - name: Codesign app bundle
        if: ${{ runner.os == 'macOS' && env.MACOS_CERT_P12_BASE64 != '' && env.MACOS_SIGN_IDENTITY != '' }}
        run: |
          APP_PATH="dist/${APP_SLUG}/${APP_NAME}.app"
          echo "Signing $APP_PATH"
          codesign --deep --force --options runtime --sign "${{ env.MACOS_SIGN_IDENTITY }}" "$APP_PATH"
          codesign --verify --verbose=2 "$APP_PATH"

      - name: Build PKG installer (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_INSTALLER_IDENTITY: ${{ env.MACOS_INSTALLER_IDENTITY }}
        run: |
          set -euo pipefail
          APP_PATH="dist/${APP_SLUG}/${APP_NAME}.app"
          ARCH=$(uname -m)
          PKG_NAME="${APP_SLUG}-mac-${ARCH}.pkg"
          test -d "${APP_PATH}" || (echo "App not found at ${APP_PATH}" && ls -la dist && exit 1)
          mkdir -p pkgroot/Applications
          cp -R "$APP_PATH" pkgroot/Applications/
          if [ -f BUNDLE_ID ]; then IDENTIFIER=$(cat BUNDLE_ID); else IDENTIFIER="com.acl.downloader"; fi
          if [ -f VERSION ]; then VERSION=$(cat VERSION); elif [ -n "${GITHUB_REF_NAME:-}" ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.1.0"; fi
          # Create component pkg (signed if identity provided)
          if [ -n "${MACOS_INSTALLER_IDENTITY:-}" ]; then
            pkgbuild --root pkgroot --identifier "$IDENTIFIER" --version "$VERSION" --install-location "/" --sign "$MACOS_INSTALLER_IDENTITY" component.pkg
            productbuild --sign "$MACOS_INSTALLER_IDENTITY" --package component.pkg "$PKG_NAME"
          else
            echo "No installer signing identity; building unsigned pkg"
            pkgbuild --root pkgroot --identifier "$IDENTIFIER" --version "$VERSION" --install-location "/" component.pkg
            productbuild --package component.pkg "$PKG_NAME"
          fi
          echo "PKG created: $PKG_NAME"

      - name: Notarize PKG
        if: ${{ runner.os == 'macOS' && env.APPLE_API_KEY_BASE68 != '' && env.APPLE_API_KEY_ID != '' && env.APPLE_API_ISSUER_ID != '' }}
        env:
          APPLE_API_KEY_BASE64: ${{ env.APPLE_API_KEY_BASE68 }}
          APPLE_API_KEY_ID: ${{ env.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ env.APPLE_API_ISSUER_ID }}
        run: |
          ARCH=$(uname -m)
          PKG_NAME="${APP_SLUG}-mac-${ARCH}.pkg"
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          xcrun notarytool submit "$PKG_NAME" --key "$KEY_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait
          xcrun stapler staple "$PKG_NAME"

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pushd dist
          # Use PowerShell Compress-Archive to avoid 7z dependency
          pwsh -NoLogo -NoProfile -Command "Compress-Archive -Path '${APP_SLUG}' -DestinationPath '../${APP_SLUG}-windows.zip' -Force"
          popd
          ls -la installer-output || true

      

      - name: Package artifacts (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tar -C dist -czf ${APP_SLUG}-linux.tar.gz ${APP_SLUG}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-artifacts
          path: |
            ${{ steps.meta.outputs.app_slug }}-windows.zip
            installer-output/${{ steps.meta.outputs.app_slug }}-Setup-x64.exe
            ${{ steps.meta.outputs.app_slug }}-linux.tar.gz
            ${{ steps.meta.outputs.app_slug }}-mac-*.pkg
          if-no-files-found: ignore

      - name: Attach to GitHub Release (on tag)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.meta.outputs.app_slug }}-windows.zip
            installer-output/${{ steps.meta.outputs.app_slug }}-Setup-x64.exe
            ${{ steps.meta.outputs.app_slug }}-linux.tar.gz
            ${{ steps.meta.outputs.app_slug }}-mac-*.pkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish Release Assets
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: |
          ls -la artifacts || true
          find artifacts -maxdepth 2 -type f -print

      - name: Attach all artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
            artifacts/**/*.pkg
            artifacts/**/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
